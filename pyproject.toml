[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsqsi"
version = "0.1.0"
description = "Rayleigh-Schroedinger effective-Hamiltonian term generator for disordered quantum spin ice"
requires-python = ">=3.10"
dependencies = [
    "sympy",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest", "scipy"]      # scipy: sparse ED in the cross-check (test-only)

[tool.setuptools]
packages = ["rsqsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"       # the ED cross-checks are opt-in: run with -m slow
markers = [
    "slow: exact-diagonalisation cross-checks (minutes); run with `pytest -m slow`",
]
